name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that must hold before code reaches main runs here, once per
  # Godot version in the support matrix. A matrix job's own status check
  # context is "test (4.4)" / "test (4.7)", never the bare job name, so this
  # cannot be the job the branch ruleset points at. The "gate" job below
  # exists only to give the ruleset the single fixed name "gate" to require.
  test:
    name: test (${{ matrix.godot-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # gdUnit4 v6.x requires Godot 4.5 or newer (it dropped support for
        # 4.4 when it moved to the 4.5 baseline), while the last v5.x release
        # is the newest one that still supports 4.4. There is no single
        # gdUnit4 release that covers both ends of this addon's own support
        # matrix, so each leg pins the gdUnit4 release that actually runs on
        # its Godot version. See the compatibility table in the gdUnit4 repo.
        include:
          # setup-godot wants a full version. '4.4' is rejected outright:
          # "Invalid version: 4.4". These are the two builds the addon is
          # actually tested against.
          - godot-version: '4.4.1'
            gdunit-version: '5.1.1'
          - godot-version: '4.7.2'
            gdunit-version: '6.2.1'
    steps:
      - uses: actions/checkout@v7

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.godot-version }}
          # divisi is pure GDScript. The .NET-enabled build is this action's
          # default and would pull in a dotnet runtime this addon never uses.
          use-dotnet: false

      - name: godot is on PATH
        run: godot --version

      # gdtoolkit's major version has to match Godot's major version or it
      # rejects valid 4.x syntax as a parse error; the minor version does not
      # need to match. Pinned to an exact release so a new gdtoolkit version
      # cannot silently start reformatting the whole addon on an unrelated PR.
      - name: install gdtoolkit
        run: pipx install "gdtoolkit==4.5.0"

      - name: gdformat --check
        run: gdformat --check $(git ls-files '*.gd')

      - name: gdlint
        run: gdlint $(git ls-files '*.gd')

      # gdUnit4 is a dev dependency: fetched here, never vendored into the
      # repository. Only addons/gdUnit4 is pulled out of the tagged source
      # tarball, straight into the project's own gitignored addons/ folder,
      # at the version this Godot leg actually supports (see the matrix
      # comment above).
      - name: install gdUnit4
        run: |
          v="${{ matrix.gdunit-version }}"
          curl -fsSL "https://github.com/MikeSchulze/gdUnit4/archive/refs/tags/v${v}.tar.gz" -o /tmp/gdunit4.tar.gz
          mkdir -p addons/gdUnit4
          tar xzf /tmp/gdunit4.tar.gz -C addons/gdUnit4 --strip-components=3 "gdUnit4-${v}/addons/gdUnit4"
          chmod +x addons/gdUnit4/runtest.sh

      # A project's resources must be imported by the editor at least once
      # before a headless run can see them; skipping this step is the usual
      # cause of a gdUnit4 CI run that silently reports zero tests instead of
      # running any.
      - name: import project resources
        run: godot --headless --path . --import --quit-after 1

      # Not runtest.sh. That script does not pass --headless, so on a runner
      # with no display Godot cannot create a DisplayServer and dies before
      # any test runs. Godot is invoked here the same way runtest.sh does,
      # with --headless added, plus --ignoreHeadlessMode, because gdUnit4
      # refuses to start under a headless display server unless it is told
      # that is deliberate.
      #
      # Exit codes come from the cmd tool: 0 all tests passed, 100 the run
      # ended in test failures, 101 warnings only. The step after this one
      # checks that contract on every run rather than taking it on trust.
      # pipefail because the output is teed to a file for the step after this
      # one: without it the pipeline reports tee's exit code and a failing test
      # run would pass this step.
      - name: gdUnit4 headless tests
        run: |
          set -o pipefail
          godot --headless --path . -d --remote-debug tcp://127.0.0.1:0 \
            -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            -a test --ignoreHeadlessMode | tee "${RUNNER_TEMP}/gdunit.log"

      # A suite that does not parse is not a failure to gdUnit4. It logs the
      # parse error, skips the file and carries on to a clean exit. That has
      # already happened once here, on one leg only, because a type expression
      # Godot 4.7 accepts is an error on 4.4: the run was green on both legs
      # with one file's worth of cases never executed on one of them, and the
      # only thing that showed it was comparing the case counts by hand. A leg
      # that quietly runs fewer suites than the repository holds is not testing
      # what it claims to, so the count is checked rather than assumed.
      - name: every test suite was discovered
        run: |
          want=$(git ls-files 'test/*.gd' | wc -l)
          got=$(sed 's/\x1b\[[0-9;]*m//g' "${RUNNER_TEMP}/gdunit.log" |
            grep -oE 'Executed test suites: \([0-9]+/[0-9]+\)' | tail -1 |
            grep -oE '[0-9]+' | head -1)
          echo "test suites in the repository: $want, discovered by gdUnit4: ${got:-none}"
          if [ "${got:-0}" -ne "$want" ]; then
            echo "gdUnit4 ran ${got:-0} suites, but test/ holds $want files."
            echo "A suite that fails to parse is skipped in silence; the parse"
            echo "error is in the test step's log above."
            exit 1
          fi

      # This whole job rests on a failing test producing a non-zero exit. A
      # gdUnit4 release that reported failures and still exited 0 would leave
      # the gate green forever and nothing else here would notice, so the
      # contract is exercised directly: a copy of the project with one
      # deliberately failing test in it has to exit 100. The copy is thrown
      # away, so nothing it does can reach the real tree.
      - name: a failing test really fails the run
        run: |
          work="${RUNNER_TEMP}/failcheck"
          rm -rf "$work"
          mkdir -p "$work"
          tar -c --exclude=.git --exclude=reports . | tar -x -C "$work"
          printf 'extends GdUnitTestSuite\n\n\nfunc test_a_deliberate_failure_is_reported_as_one() -> void:\n\tassert_int(1).is_equal(2)\n' \
            > "$work/test/deliberate_failure_test.gd"
          set +e
          godot --headless --path "$work" -d --remote-debug tcp://127.0.0.1:0 \
            -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            -a test/deliberate_failure_test.gd --ignoreHeadlessMode
          code=$?
          set -e
          rm -rf "$work"
          if [ "$code" -ne 100 ]; then
            echo "a deliberately failing test exited $code, want 100"
            exit 1
          fi

      # plugin.cfg is the one file Godot itself reads to enable the addon, so
      # its absence or a malformed version is worth catching on every PR
      # rather than at packaging time in the release workflow.
      - name: addon structure
        run: |
          test -f addons/divisi/plugin.cfg || { echo "addons/divisi/plugin.cfg is missing"; exit 1; }
          test -f LICENSE || { echo "LICENSE is missing at the repo root"; exit 1; }
          version=$(grep -m1 -oP '(?<=^version=")[^"]+(?=")' addons/divisi/plugin.cfg || true)
          if [ -z "$version" ]; then
            echo "addons/divisi/plugin.cfg has no version=\"...\" line"
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "addons/divisi/plugin.cfg version '$version' is not a plain X.Y.Z"
            exit 1
          fi

      # -I skips binary files. A compressed ogg or webm will sooner or later hold a
      # byte sequence that decodes as one of these, and failing the build over the
      # innards of an audio file teaches a contributor nothing.
      - name: no em or en dashes
        run: |
          if git grep -nPI '\x{2014}|\x{2013}' -- .; then
            echo "Em and en dashes are not used in this repository. Use a plain hyphen."
            exit 1
          fi

      # The release job depends on this script; a tag whose CHANGELOG section
      # is missing must fail here, on the PR, not at publish time. The script
      # has its own tests, and the real CHANGELOG's top section must extract.
      - name: release notes script
        run: |
          .github/scripts/release-notes_test.sh
          top="$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]*)?\]' CHANGELOG.md | sed -e 's/^## \[//' -e 's/\]$//')"
          .github/scripts/release-notes.sh "v$top" CHANGELOG.md >/dev/null

  # The single check the branch ruleset requires. It needs the whole matrix
  # and fails on anything but a clean success across every leg: "if: always()"
  # keeps this job running even when a matrix leg failed (the default would
  # skip it), and comparing needs.test.result to the literal string "success"
  # means a cancelled or skipped leg fails the gate too, not just a failed one.
  gate:
    name: gate
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: matrix result
        run: |
          result="${{ needs.test.result }}"
          if [ "$result" != "success" ]; then
            echo "test matrix result was '$result', want 'success'"
            exit 1
          fi
